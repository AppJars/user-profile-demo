# ============================================================
# Demo database (embedded H2, file based under ./data)
# ============================================================

# JDBC URL of the demo database; delete the ./data folder to start over
spring.datasource.url=jdbc:h2:./data/userprofiledb;FILE_LOCK=NO

# JDBC driver
spring.datasource.driverClassName=org.h2.Driver

# Database user
spring.datasource.username=sa

# Database password (empty in the demo)
spring.datasource.password=

# Web console for the demo database, at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# ============================================================
# JPA and Hibernate
# ============================================================

# Create and update the demo schema on startup
spring.jpa.hibernate.ddl-auto=update

# Let Hibernate generate the DDL from the entity model
spring.jpa.generate-ddl=true

# Print the generated SQL (set to true to follow what the AppJar does)
spring.jpa.show-sql=false

# Pretty print the SQL when show-sql is enabled
spring.jpa.properties.hibernate.format_sql=true

# Keep the persistence session open for the whole request; the AppJar data layer needs it
spring.jpa.open-in-view=true


# ============================================================
# Avatar uploads
# ============================================================

# Maximum avatar size accepted by the profile form
spring.servlet.multipart.max-file-size=10MB

# Maximum size of the whole upload request
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# Spring
# ============================================================

# ============================================================
# User Profile AppJar - view routes
# ============================================================

# Route of the current user's own profile view
# Default: up/profile
com.appjars.userprofile.url.profile=up/profile

# Route of the administration list of every profile
# Default: up/profile-list
com.appjars.userprofile.url.profile-list=up/profile-list

# ============================================================
# User Profile AppJar - behavior
# ============================================================

# Send a user without a profile to the profile view right after login
com.appjars.userprofile.feat.redirect=true
