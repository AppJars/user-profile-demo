# Login
appjars.userprofiledemo.login.title=User Profile Demo
appjars.userprofiledemo.login.intro=Explore the demo: log in as any of the existing profiles, or as a brand-new user to see the create-your-profile redirect. No password needed.
appjars.userprofiledemo.login.desc.admin=Administrator, with full access: browse and edit every user''s profile.
appjars.userprofiledemo.login.desc.user=Standard user: view and edit only your own profile.
appjars.userprofiledemo.login.button=Log in
appjars.userprofiledemo.login.newuser.title=John Doe
appjars.userprofiledemo.login.newuser.desc=A brand-new user without a profile yet. Logging in triggers the post-login redirect to create one.
appjars.userprofiledemo.login.error=Login failed. Please try again.

# Home (landing page)
appjars.userprofiledemo.demo.home.title=User Profile Demo
appjars.userprofiledemo.demo.home.hero.title=User Profile
appjars.userprofiledemo.demo.home.hero.tagline=Ready-to-use user profile management for Vaadin and Spring Boot applications: self-service profile editing, avatars with image cropping, and a full administration view. This demo lets you try every feature before adding the AppJar to your project.
appjars.userprofiledemo.demo.home.features.title=What''s inside
appjars.userprofiledemo.demo.home.features.myprofile.title=My Profile
appjars.userprofiledemo.demo.home.features.myprofile.desc=Each user can create, edit and delete their own profile: name, email, phone and address.
appjars.userprofiledemo.demo.home.features.avatar.title=Avatar management
appjars.userprofiledemo.demo.home.features.avatar.desc=Upload a picture (PNG, JPEG, GIF, BMP or WebP, up to 10MB) and crop it in place with a circular viewport.
appjars.userprofiledemo.demo.home.features.administration.title=Profile administration
appjars.userprofiledemo.demo.home.features.administration.desc=Administrators get a searchable overview of every profile in the system, with full control to create, edit or remove any of them.
appjars.userprofiledemo.demo.home.features.responsive.title=Responsive design
appjars.userprofiledemo.demo.home.features.responsive.desc=Views adapt to mobile, tablet and desktop screen sizes out of the box.
appjars.userprofiledemo.demo.home.features.redirect.title=Post-login redirect
appjars.userprofiledemo.demo.home.features.redirect.desc=Users without a profile are automatically taken to create one right after logging in (configurable).
appjars.userprofiledemo.demo.home.features.configurable.title=Configurable by properties
appjars.userprofiledemo.demo.home.features.configurable.desc=View routes and behavior flags are plain Spring properties: adapt the AppJar to your application without writing code.
appjars.userprofiledemo.demo.home.features.events.title=Event integration
appjars.userprofiledemo.demo.home.features.events.desc=Profile changes publish Spring application events so the rest of your application can react to them.
appjars.userprofiledemo.demo.home.tryit.title=Try it now
appjars.userprofiledemo.demo.home.tryit.intro=Log in with any of these demo accounts. No password needed, and each one shows a different side of the AppJar:
appjars.userprofiledemo.demo.home.tryit.admin=ADMIN role, with a profile. Manage every profile from the User Profiles list view.
appjars.userprofiledemo.demo.home.tryit.clara=USER role, with an existing profile. Edit her data and avatar in My Profile.
appjars.userprofiledemo.demo.home.tryit.johndoe=USER role, without a profile yet. Logging in triggers the automatic redirect to profile creation.
appjars.userprofiledemo.demo.home.tryit.myprofile=My Profile
appjars.userprofiledemo.demo.home.tryit.userlist=User Profiles list (admin)
appjars.userprofiledemo.demo.home.tryit.adminhint=The views marked (admin) are restricted to the ADMIN role. Log in with the administrator account listed above to open them, or you''ll land on an access-denied page.
appjars.userprofiledemo.demo.home.tour.button=Guided tour
appjars.userprofiledemo.demo.home.tour.myprofile=My Profile view
appjars.userprofiledemo.demo.home.tour.userlist=User Profiles list view (administration)
appjars.userprofiledemo.demo.home.license.title=Free vs. full license
appjars.userprofiledemo.demo.home.license.desc=This demo runs in free mode: every feature is fully functional, limited to 5 profiles in total. A full license removes the limit, and nothing else changes.
appjars.userprofiledemo.demo.home.license.link=Get a license at appjars.com
appjars.userprofiledemo.demo.home.links.title=Learn more
appjars.userprofiledemo.demo.home.links.github=AppJars on GitHub
appjars.userprofiledemo.demo.home.links.readme=User Profile documentation

# Guided tours
appjars.userprofiledemo.demo.tour.btn.next=Next
appjars.userprofiledemo.demo.tour.btn.back=Back
appjars.userprofiledemo.demo.tour.btn.done=Done
appjars.userprofiledemo.demo.tour.myprofile.intro.title=My Profile view
appjars.userprofiledemo.demo.tour.myprofile.intro.desc=A short tour of the view where every user manages their own profile. Use Next to walk through it. You can close the tour at any time and reopen it from the Guided tour menu.
appjars.userprofiledemo.demo.tour.myprofile.form.title=Your profile
appjars.userprofiledemo.demo.tour.myprofile.form.desc=This form manages the profile of the logged-in user: if you don''t have one yet you can create it here, and if you already do you can edit it. Either way your changes are saved on confirm.
appjars.userprofiledemo.demo.tour.myprofile.username.title=Username
appjars.userprofiledemo.demo.tour.myprofile.username.desc=The username comes from the authentication layer, so it is read-only here.
appjars.userprofiledemo.demo.tour.myprofile.avatar.title=Avatar upload
appjars.userprofiledemo.demo.tour.myprofile.avatar.desc=Drop or pick an image (up to 10MB) and crop it in a circular viewport before saving.
appjars.userprofiledemo.demo.tour.myprofile.save.title=Save your changes
appjars.userprofiledemo.demo.tour.myprofile.save.desc=Validation runs on save: first name is required and the email must be valid.
appjars.userprofiledemo.demo.tour.myprofile.finish.title=That''s it!
appjars.userprofiledemo.demo.tour.myprofile.finish.desc=Tip: log in as John Doe (a user without a profile) to see the automatic redirect to profile creation. Also check the User Profiles list view for administration.
appjars.userprofiledemo.demo.tour.userlist.intro.title=User Profiles list view
appjars.userprofiledemo.demo.tour.userlist.intro.desc=A short tour of the administration view, where an administrator manages every profile in the system. Use Next to walk through it. You can close the tour at any time and reopen it from the Guided tour menu.
appjars.userprofiledemo.demo.tour.userlist.grid.title=All profiles
appjars.userprofiledemo.demo.tour.userlist.grid.desc=Every profile in the system, with avatar, username, email and creation date. Click a column header to sort server-side; each row has edit and delete actions.
appjars.userprofiledemo.demo.tour.userlist.filters.title=Filters
appjars.userprofiledemo.demo.tour.userlist.filters.desc=Filter by username, first name, last name, email or a creation date range. On small screens the filters move into a dialog.
appjars.userprofiledemo.demo.tour.userlist.create.title=Create profiles
appjars.userprofiledemo.demo.tour.userlist.create.desc=Open the profile dialog to create a new profile, avatar included.
appjars.userprofiledemo.demo.tour.userlist.license.title=Free mode limit
appjars.userprofiledemo.demo.tour.userlist.license.desc=In free mode the system holds up to 5 profiles: the badge above the filters shows how many are in use, and New profile is disabled once the limit is reached. A full license removes the limit.

