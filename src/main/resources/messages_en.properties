appjars.userprofiledemo.accessdenied.title=Access Denied
appjars.userprofiledemo.accessdenied.desc=Current user does not have access to this view
appjars.userprofiledemo.routenotfound.title=Route not found
appjars.userprofiledemo.routenotfound.desc=This route does not exist

